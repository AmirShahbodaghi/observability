workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: never

stages:
  - validate
  - deploy_prometheus
  - verify_prometheus
  - deploy_thanos_sidecar
  - verify_thanos_sidecar
  - deploy_thanos_store
  - verify_thanos_store
  - deploy_thanos_compactor
  - verify_thanos_compactor
  - deploy_thanos_query
  - verify_thanos_query
  - deploy_grafana
  - verify_grafana
  - deploy_tempo
  - verify_tempo
  - final_verify
  - lifecycle

variables:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_CONFIG: ansible.cfg
  ANSIBLE_INVENTORY: inventory/hosts.yml

default:
  before_script:
    - ansible --version
    - ansible-galaxy collection install -r requirements.yml

# ---------- validate ----------
validate:
  stage: validate
  script:
    - ansible-playbook site.yml --syntax-check
    - ansible-playbook playbooks/lifecycle.yml --syntax-check
    - ansible-playbook playbooks/verify.yml --syntax-check

# ---------- hidden templates ----------
.deploy:
  script:
    - ansible-playbook site.yml --tags "${APP}" -i "$ANSIBLE_INVENTORY"

.verify:
  script:
    - ansible-playbook playbooks/verify.yml --tags "${APP}" -i "$ANSIBLE_INVENTORY"

.lifecycle:
  stage: lifecycle
  when: manual
  script:
    - ansible-playbook playbooks/lifecycle.yml
      --tags "${APP}"
      -e "service_action=${ACTION}"
      -i "$ANSIBLE_INVENTORY"

# ---------- prometheus ----------
deploy_prometheus:
  stage: deploy_prometheus
  extends: .deploy
  variables: { APP: prometheus }

verify_prometheus:
  stage: verify_prometheus
  extends: .verify
  variables: { APP: prometheus }

prometheus_start:    { extends: .lifecycle, variables: { APP: prometheus, ACTION: start } }
prometheus_stop:     { extends: .lifecycle, variables: { APP: prometheus, ACTION: stop } }
prometheus_restart:  { extends: .lifecycle, variables: { APP: prometheus, ACTION: restart } }
prometheus_reset:    { extends: .lifecycle, variables: { APP: prometheus, ACTION: reset } }

# ---------- thanos sidecar ----------
deploy_thanos_sidecar:
  stage: deploy_thanos_sidecar
  extends: .deploy
  variables: { APP: thanos_sidecar }

verify_thanos_sidecar:
  stage: verify_thanos_sidecar
  extends: .verify
  variables: { APP: thanos_sidecar }

thanos_sidecar_start:    { extends: .lifecycle, variables: { APP: thanos_sidecar, ACTION: start } }
thanos_sidecar_stop:     { extends: .lifecycle, variables: { APP: thanos_sidecar, ACTION: stop } }
thanos_sidecar_restart:  { extends: .lifecycle, variables: { APP: thanos_sidecar, ACTION: restart } }
thanos_sidecar_reset:    { extends: .lifecycle, variables: { APP: thanos_sidecar, ACTION: reset } }

# ---------- thanos store ----------
deploy_thanos_store:
