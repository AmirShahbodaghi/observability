  variables: { APP: tempo }

tempo_start:    { extends: .lifecycle, variables: { APP: tempo, ACTION: start } }
tempo_stop:     { extends: .lifecycle, variables: { APP: tempo, ACTION: stop } }
tempo_restart:  { extends: .lifecycle, variables: { APP: tempo, ACTION: restart } }
tempo_reset:    { extends: .lifecycle, variables: { APP: tempo, ACTION: reset } }

# ---------- final ----------
final_verify:
  stage: final_verify
  script:
    - ansible-playbook playbooks/verify.yml -i "$ANSIBLE_INVENTORY"