  variables: { APP: thanos_query }

thanos_query_start:    { extends: .lifecycle, variables: { APP: thanos_query, ACTION: start } }
thanos_query_stop:     { extends: .lifecycle, variables: { APP: thanos_query, ACTION: stop } }
thanos_query_restart:  { extends: .lifecycle, variables: { APP: thanos_query, ACTION: restart } }
thanos_query_reset:    { extends: .lifecycle, variables: { APP: thanos_query, ACTION: reset } }

# ---------- grafana ----------
deploy_grafana:
  stage: deploy_grafana
  extends: .deploy
  variables: { APP: grafana }

