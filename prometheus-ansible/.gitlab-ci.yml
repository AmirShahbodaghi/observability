  variables: { APP: thanos_store }

thanos_store_start:    { extends: .lifecycle, variables: { APP: thanos_store, ACTION: start } }
thanos_store_stop:     { extends: .lifecycle, variables: { APP: thanos_store, ACTION: stop } }
thanos_store_restart:  { extends: .lifecycle, variables: { APP: thanos_store, ACTION: restart } }
thanos_store_reset:    { extends: .lifecycle, variables: { APP: thanos_store, ACTION: reset } }

# ---------- thanos compactor ----------
deploy_thanos_compactor:
  stage: deploy_thanos_compactor
  extends: .deploy
  variables: { APP: thanos_compactor }

verify_thanos_compactor:
  stage: verify_thanos_compactor
  extends: .verify
  variables: { APP: thanos_compactor }

thanos_compactor_start:    { extends: .lifecycle, variables: { APP: thanos_compactor, ACTION: start } }
thanos_compactor_stop:     { extends: .lifecycle, variables: { APP: thanos_compactor, ACTION: stop } }
thanos_compactor_restart:  { extends: .lifecycle, variables: { APP: thanos_compactor, ACTION: restart } }
thanos_compactor_reset:    { extends: .lifecycle, variables: { APP: thanos_compactor, ACTION: reset } }

# ---------- thanos query ----------
deploy_thanos_query:
