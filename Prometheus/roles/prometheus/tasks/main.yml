---
- name: Ensure Docker monitoring network exists
  community.docker.docker_network:
    name: "{{ monitoring_network }}"
    state: present

- name: Ensure Prometheus directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules"
    - "{{ prometheus_config_dir }}/file_sd"
    - "{{ prometheus_data_dir }}"

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "65534"
    group: "65534"
    mode: "0644"
  register: prometheus_config
  notify: Reload Prometheus

- name: Deploy empty file_sd keep-alive
  ansible.builtin.copy:
    dest: "{{ prometheus_config_dir }}/file_sd/.keep"
    content: ""
    owner: "65534"
    group: "65534"
    mode: "0644"

- name: Deploy empty rules keep-alive
  ansible.builtin.copy:
    dest: "{{ prometheus_config_dir }}/rules/.keep"
    content: ""
    owner: "65534"
    group: "65534"
    mode: "0644"

- name: Deploy Prometheus container
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    image: "{{ prometheus_image }}:{{ prometheus_version }}"
    user: "{{ prometheus_user | default('65534:65534') }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: "{{ monitoring_network }}"
    published_ports:
      - "{{ prometheus_port }}:9090"
    volumes:
      - "{{ prometheus_config_dir }}:/etc/prometheus:ro"
      - "{{ prometheus_data_dir }}:/prometheus:rw"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time={{ prometheus_retention }}"
      - "--storage.tsdb.min-block-duration={{ prometheus_block_duration | default('2h') }}"
      - "--storage.tsdb.max-block-duration={{ prometheus_block_duration | default('2h') }}"
      - "--web.enable-lifecycle"
      - "--web.external-url={{ prometheus_external_url | default('http://' ~ ansible_host ~ ':9090') }}"
      - "--storage.tsdb.wal-compression"
  register: prometheus_container

- name: Wait until Prometheus is healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_port }}/-/healthy"
    method: GET
    status_code: 200
  register: prometheus_health
  retries: 30
  delay: 2
  until: prometheus_health.status | default(0) == 200

- name: Apply Prometheus reload if config changed on a running container
  ansible.builtin.meta: flush_handlers