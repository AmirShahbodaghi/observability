        devops_kc_opt_mng:

    opt_group:
      children:
        opt_master_group:
        opt_etcd_group:
        opt_worker_group:
        opt_ha_group:
        opt_infra_group:


  vars:
    ansible_user: devops
    ansible_become: true
    ansible_port: 10022
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
#    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
