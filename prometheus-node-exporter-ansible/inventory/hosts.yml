        devops_kc_dev_Node2:
        devops_kc_dev_Node3:
        devops_kc_dev_Node4:

    dev_infra_group:
      hosts:
        devops_infra_common_runner:
        devops_infra_common_Reg:
        devops_infra_common_mng:
        devops_infra_common_nfr:
        devops_infra_common_nfs:
